<svg viewBox="0 0 100 100" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="es-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1338" />
      <stop offset="50%" stop-color="#0d0818" />
      <stop offset="100%" stop-color="#040208" />
    </linearGradient>

    <!-- Neon Border Gradient -->
    <linearGradient id="es-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#a855f7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.35" />
    </linearGradient>

    <!-- Facet E Gradient -->
    <linearGradient id="es-e" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e8ff" />
      <stop offset="35%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Dual Drives Left Gradient -->
    <linearGradient id="es-drive" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="60%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Shield Hardware Core Gradient -->
    <linearGradient id="es-shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Neon Drop Shadow Filter -->
    <filter id="es-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#a855f7" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Badge Plate -->
  <rect
    x="4"
    y="4"
    width="92"
    height="92"
    rx="24"
    fill="url(#es-bg)"
    stroke="url(#es-stroke)"
    stroke-width="1.75"
    filter="url(#es-glow)"
  />

  <!-- Subtle inner circuit grid lines -->
  <path
    d="M20 50L50 67L80 50M50 67V86"
    stroke="rgba(168, 85, 247, 0.2)"
    stroke-width="1"
    stroke-dasharray="2 2"
  />

  <!-- LEFT FACET: DUAL DRIVES (Primary + Replica mirrored storage tiers) -->
  <!-- Drive 1 (Primary - Top) -->
  <g>
    <path d="M23 42L47 55V61L23 48Z" fill="url(#es-drive)" fill-opacity="0.9" />
    <path d="M23 42L35 35L47 48L47 55L23 42Z" fill="#c084fc" fill-opacity="0.25" />
    <circle cx="28" cy="46" r="1.75" fill="#34d399" />
  </g>

  <!-- Drive 2 (Replica - Bottom) -->
  <g>
    <path d="M23 56L47 69V75L23 62Z" fill="url(#es-drive)" fill-opacity="0.9" />
    <path d="M23 56L35 49L47 62L47 69L23 56Z" fill="#c084fc" fill-opacity="0.25" />
    <circle cx="28" cy="60" r="1.75" fill="#38bdf8" />
  </g>

  <!-- RIGHT FACET: ARCHITECTURAL "E" INTERLOCK -->
  <path
    d="M53 32 L77 18 L77 26 L61 35 L61 44 L75 36 L75 44 L61 52 L61 63 L77 54 L77 62 L53 76 Z"
    fill="url(#es-e)"
    stroke="rgba(255, 255, 255, 0.45)"
    stroke-width="0.8"
  />

  <!-- CENTER TOP: HARDWARE KEY-SD SHIELD (Cryptographic Interlock) -->
  <g transform="translate(40, 15)">
    <path
      d="M10 2L18 6V13C18 18 10 23 10 23C10 23 2 18 2 13V6L10 2Z"
      fill="url(#es-shield)"
      stroke="#ffffff"
      stroke-width="1.2"
    />
    <circle cx="10" cy="10" r="2.2" fill="#09090d" />
    <path d="M9 10H11L11.5 15H8.5L9 10Z" fill="#09090d" />
  </g>
</svg>
