services:
  mongo:
    image: mongo:7.0
    container_name: edgestore-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - edgestore_mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=${MONGO_DB_NAME:-edgestore_clients}
    security_opt:
      - no-new-privileges:true

  edgestore-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edgestore-appliance
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - ENVIRONMENT_MODE=docker
      - HOST=0.0.0.0
      - PORT=8000
      - PRIMARY_STORAGE_PATH=/data/primary
      - REPLICA_STORAGE_PATH=/data/replica
      - DATABASE_URL=sqlite:////data/db/edgestore.db
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017}
      - MONGO_DB_NAME=${MONGO_DB_NAME:-edgestore_clients}
      - JWT_SECRET=${JWT_SECRET:-edgestore_phase1_super_secret_jwt_key_change_in_production_32b}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      - INITIAL_ADMIN_USERNAME=${INITIAL_ADMIN_USERNAME:-admin}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-AdminEdgeStore2026!}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-admin@edgestore.local}
      - RATE_LIMIT_LOGIN_MAX_ATTEMPTS=${RATE_LIMIT_LOGIN_MAX_ATTEMPTS:-5}
      - RATE_LIMIT_LOGIN_WINDOW_SECONDS=${RATE_LIMIT_LOGIN_WINDOW_SECONDS:-300}
      - MAX_UPLOAD_SIZE_BYTES=${MAX_UPLOAD_SIZE_BYTES:-104857600}
      - MIN_FREE_DISK_BYTES=${MIN_FREE_DISK_BYTES:-10485760}
      - ALLOWED_CORS_ORIGINS=${ALLOWED_CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173","http://localhost:8000","http://127.0.0.1:8000","http://localhost:4200","http://127.0.0.1:4200","http://localhost:3000","http://127.0.0.1:3000"]}
      - ENABLE_SECURITY_HEADERS=True
      - STRICT_TRANSPORT_SECURITY=${STRICT_TRANSPORT_SECURITY:-False}
      - DDOS_PROTECTION_ENABLED=${DDOS_PROTECTION_ENABLED:-True}
      - DDOS_BURST_MAX_REQUESTS=${DDOS_BURST_MAX_REQUESTS:-40}
      - DDOS_BURST_WINDOW_SECONDS=${DDOS_BURST_WINDOW_SECONDS:-5}
      - DDOS_BAN_DURATION_SECONDS=${DDOS_BAN_DURATION_SECONDS:-180}
      - ANTI_BOT_VERIFIED_CACHE_SECONDS=${ANTI_BOT_VERIFIED_CACHE_SECONDS:-86400}
      - ANTI_BOT_CHALLENGE_EXPIRE_SECONDS=${ANTI_BOT_CHALLENGE_EXPIRE_SECONDS:-300}
      - REQUIRE_BOT_VERIFICATION_BEFORE_LOGIN=${REQUIRE_BOT_VERIFICATION_BEFORE_LOGIN:-True}
    volumes:
      # Persistent storage for Primary, Replica, and SQLite Database
      - ${PRIMARY_STORAGE_VOLUME:-edgestore_primary}:/data/primary
      - ${REPLICA_STORAGE_VOLUME:-edgestore_replica}:/data/replica
      - ${DB_STORAGE_VOLUME:-edgestore_db}:/data/db
    # Defense-in-depth container hardening (No privileged flag, dropped capabilities)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  edgestore_primary:
    name: ${PRIMARY_VOLUME_NAME:-edgestore_phase1_primary}
  edgestore_replica:
    name: ${REPLICA_VOLUME_NAME:-edgestore_phase1_replica}
  edgestore_db:
    name: ${DB_VOLUME_NAME:-edgestore_phase1_db}
  edgestore_mongo_data:
    name: ${MONGO_VOLUME_NAME:-edgestore_phase1_mongo}
